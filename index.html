<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVME - Future Fashion</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
}

body{
    background:#0a0a0a;
    color:white;
    overflow-x:hidden;
}

header{
    position:fixed;
    width:100%;
    top:0;
    z-index:100;
    padding:20px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(10px);
    background:rgba(0,0,0,.4);
}

.logo{
    font-size:2rem;
    font-weight:800;
    letter-spacing:5px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    transition:.3s;
}

nav a:hover{
    color:#777;
}

.hero{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.7)),
    url("https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1400&q=80");
    background-size:cover;
    background-position:center;
}

.hero-content h1{
    font-size:clamp(3rem,8vw,6rem);
    letter-spacing:10px;
}

.hero-content p{
    margin-top:15px;
    font-size:1.2rem;
    color:#ccc;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 35px;
    border:2px solid white;
    color:white;
    text-decoration:none;
    transition:.3s;
}

.btn:hover{
    background:white;
    color:black;
}

.section{
    padding:100px 10%;
}

.section-title{
    text-align:center;
    font-size:3rem;
    margin-bottom:50px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}

.card{
    background:#111;
    border-radius:15px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:350px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-content h3{
    margin-bottom:10px;
}

.price{
    color:#bbb;
}

.about{
    text-align:center;
    max-width:850px;
    margin:auto;
    line-height:1.8;
    color:#ccc;
}

footer{
    text-align:center;
    padding:40px;
    background:#050505;
    color:#888;
}
</style>
</head>
<body>

<header>
    <div class="logo">NVME</div>
    <nav>
        <a href="#shop">Shop</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>NVME</h1>
        <p>Engineered for the next generation.</p>
        <a href="#shop" class="btn">SHOP NOW</a>
    </div>
</section>

<section class="section" id="shop">
    <h2 class="section-title">Featured Collection</h2>

    <div class="products">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80">
            <div class="card-content">
                <h3>NVME Oversized T-shirt</h3>
                <p class="price">£20
